function guidePage(s, open){
  const o = open === "guide" ? "tips" : open;
  const list = a => a.map((t, i) => `<div class="tipc"><div class="n">${i + 1}</div><div><b>${esc(t[0])}</b><p>${esc(t[1])}</p></div></div>`).join("");
  const sec = (k, title, icon, inner) => `<details class="glass acc" ${o === k ? "open" : ""}><summary>${ic(icon)}<span>${title}</span></summary><div class="accb">${inner}</div></details>`;
  const notice = `<div class="warn"><b class="hl">تنبيه:</b> كثرة البلاغات على حساب قد تؤدي إلى تقييده أو حذفه، إذا ثبتت مخالفات مثل السبّ أو الشتم أو أي إساءة، وذلك بعد مراجعة البلاغات والتأكد منها.</div>`;

    notice + sec("tips","كيف نتعامل بلطف","chat", list(TIPS)) + sec("safety","كيف نحمي حسابنا","shield", list(SAFE)) +
    sec("respect","الاحترام أساس التعامل بين الناس","star", `<p>احترم غيرك بكلامك وأفعالك، فالكلمة الطيبة صدقة، والأسلوب الراقي دليل على حسن التربية. لا تجرح مشاعر الآخرين، ولا تقلّل من شأن أحد، واختلف مع الناس بأدب واحترام.</p><p>تذكّر دائماً: عامل الناس كما تحب أن يعاملوك، فالاحترام لا يُفرض بالقوة، بل يُكتسب بالأخلاق، والكلمة الطيبة تترك أثراً جميلاً في القلوب.</p>`));

function suggestPage(s){

  infoPage(s, "ساعدنا نطوّر الموقع", "اكتب أي فكرة أو ملاحظة، وسنقرأها بعناية. لا تحتاج حسابًا.",
    `<div class="glass sm" id="sbox"><div class="lbl">نوع اقتراحك</div><div class="chips" id="sk"></div><textarea id="sg" rows="5" maxlength="480" placeholder="اكتب فكرتك هنا..."></textarea><div class="cnt" id="sc">0 / 480</div><button id="sgb">أرسل الاقتراح</button><div class="note" id="sgn"></div></div><div class="glass sm"><h2>التواصل مع المطور</h2><p class="tag">للتواصل المباشر أو الاستفسار، تفضّل بزيارة حساب المطور.</p><a class="shb" href="${FB}" target="_blank" rel="noopener noreferrer">${ic("fb")} حساب المطور على فيسبوك</a></div>`);
  let kind = "فكرة"; const PH = { "فكرة":"اكتب فكرتك هنا...", "مشكلة":"اكتب مشكلتك هنا...", "تحسين":"اكتب اقتراح التحسين هنا..." };
  ["فكرة","مشكلة","تحسين"].forEach(k => { const c = mk("div", "chip" + (k === kind ? " on" : ""), k); c.onclick = () => { kind = k; $("sg").placeholder = PH[k]; [...$("sk").children].forEach(x => x.classList.toggle("on", x === c)); }; $("sk").appendChild(c); });
  $("sg").oninput = () => { $("sc").textContent = $("sg").value.length.toLocaleString("en") + " / 480"; };
  $("sgb").onclick = async()=>{
    const v = $("sg").value.trim();
    if(!v) return say("sgn","اكتب اقتراحك أولًا");
    $("sgb").disabled = true;
    const r = await db.from("suggestions").insert({ user_id: s ? s.user.id : null, body: "[" + kind + "] " + v });
    $("sgb").disabled = false;
    if(r.error) return say("sgn", (r.error.message || "").includes("TOOFAST") ? "وصلتنا اقتراحات كثيرة الآن، حاول بعد قليل" : "تعذّر الإرسال، حاول مرة أخرى");
    $("sbox").innerHTML = `<div class="ok"><div class="big">${ic("check")}</div><b>شكرًا لك!</b><small class="tag">وصل اقتراحك إلى فريق الموقع.</small></div>`;
  };
}

function authPage(mode){
  const su = mode === "signup";
  if(su && !on("allow_signup")){ el(`${HOME}<div class="glass sm"><p class="sub">التسجيل مغلق مؤقتًا، حاول لاحقًا.</p></div>`); return; }
  el(`${HOME}<div class="hero" style="padding:12px 0 4px"><div class="logo">${ic("chat")}</div><h1 class="brand" style="font-size:clamp(36px,10vw,46px)">${esc(N())}</h1></div>
  <div class="glass sm"><h2>${su ? "أنشئ حسابك" : "أهلًا بعودتك"}</h2>
    ${su ? `<div class="chips" id="gen"><div class="chip" data-g="ذكر">ذكر</div><div class="chip" data-g="أنثى">أنثى</div></div>` : ""}
    <input id="email" type="email" placeholder="البريد الإلكتروني" dir="ltr" autocomplete="email">
    ${su ? `<input id="username" placeholder="اسمك الذي يظهر لأصدقائك" maxlength="25" autocomplete="off">
    <input id="slug" placeholder="رابطك الخاص (اختياري)" dir="ltr" maxlength="25" autocomplete="off">` : ""}
    <input id="pass" type="password" placeholder="${su ? "كلمة المرور (8 أحرف على الأقل)" : "كلمة المرور"}" dir="ltr" autocomplete="${su ? "new-password" : "current-password"}">
    ${su ? `<p class="mini">احفظ كلمة المرور، فلا يمكن استرجاعها حاليًا.</p>` : ""}
    <div class="hc" id="hc"></div>
    <button id="act">${su ? "إنشاء الحساب" : "دخول"}</button>
    <button class="ghost" id="sw">${su ? "لدي حساب" : "إنشاء حساب جديد"}</button>
    <div class="note" id="note"></div></div>`);
  mountCaptcha();
  $("sw").onclick = () => go(su ? "?login" : "?signup");
  let gender = "";
  if(su) $("gen").onclick = e => { const c = e.target.closest(".chip"); if(!c) return; gender = c.dataset.g; [...$("gen").children].forEach(x => x.classList.toggle("on", x === c)); };
  const rnd = () => "u" + Math.random().toString(36).slice(2, 8);
  $("act").onclick = async()=>{
    const email = $("email").value.trim(), pass = $("pass").value;
    say("note","");
    if(!email || !pass) return say("note","أدخل البريد الإلكتروني وكلمة المرور");
    const token = hcToken();
    if(!token) return say("note","أكمل مربع التحقق أولًا");
    if(!su){
      $("act").disabled = true;
      const { data, error } = await db.auth.signInWithPassword({ email, password: pass, options: { captchaToken: token } });
      $("act").disabled = false;
      if(error){ hcReset(); return say("note", arErr(error)); }
      return params.has("admin") ? adminPage() : params.has("profile") ? editPage(data.user) : dashboard(data.user);
    }
    const u = normName($("username").value); let sl = $("slug").value.trim().toLowerCase(); const auto = !sl; if(auto) sl = rnd();
    if(!gender) return say("note","اختر الجنس");
    if(!nameOk(u)) return say("note", NAME_MSG);
    if(!slugOk(sl)) return say("note", SLUG_MSG);
    if(pass.length < 8) return say("note","كلمة المرور يجب أن تكون 8 أحرف على الأقل");
    $("act").disabled = true;
    const t1 = await db.from("profiles").select("id").eq("username", u).maybeSingle();
    if(t1.data){ $("act").disabled = false; hcReset(); return say("note","هذا الاسم محجوز، اختر اسمًا آخر"); }
    let t2 = await db.from("profiles").select("id").eq("slug", sl).maybeSingle();
    for(let i = 0; auto && t2.data && i < 3; i++){ sl = rnd(); t2 = await db.from("profiles").select("id").eq("slug", sl).maybeSingle(); }
    if(t2.data){ $("act").disabled = false; hcReset(); return say("note","هذا الرابط محجوز، اختر رابطًا آخر"); }
    const { data, error } = await db.auth.signUp({ email, password: pass, options:{ captchaToken: token, data:{ username: u, slug: sl, gender } } });
    if(error){ $("act").disabled = false; hcReset(); return say("note", arErr(error)); }
    if(!data.session){ $("act").disabled = false; return say("note","تم إنشاء الحساب. أكّد بريدك الإلكتروني ثم سجّل الدخول.", true); }
    const r = await db.from("profiles").insert({ id: data.user.id, username: u, slug: sl, gender });
    $("act").disabled = false;
    if(r.error) return say("note", r.error.code === "23505" ? "الاسم أو الرابط محجوز، اختر غيره" : "تعذّر إنشاء الحساب، حاول مرة أخرى");
    dashboard(data.user);
  };
}

function msgCard(m, user, main){
  const d = mk("div","msg"); if(main) d.id = "m" + m.id;
  if(m.fresh) d.appendChild(mk("span","new","جديدة"));
  if(m.sender_name) d.appendChild(mk("small","from","من: " + m.sender_name));
  d.appendChild(mk("p","sel", m.body));
  if(m.reply) d.appendChild(mk("p","rep","ردّك: " + m.reply));
  d.appendChild(mk("small", null, fmt(m.created_at) + (m.is_public ? " • منشورة في صفحتك" : " • خاصة")));
  const row = mk("div");
  const up = async f => { await db.from("messages").update(f).eq("id", m.id); loadMsgs(user); };
  const st = mkb("sbtn ghost", m.starred ? "unstar" : "star", m.starred ? "إزالة التمييز" : "تمييز"); st.onclick = () => up({ starred: !m.starred });
  const pub = mkb("sbtn ghost", m.is_public ? "unpub" : "globe", m.is_public ? "إلغاء النشر" : "نشر في صفحتي"); pub.onclick = () => up({ is_public: !m.is_public });

  rp.onclick = ()=>{
    rp.disabled = true;
    const ta = mk("textarea"); ta.rows = 3; ta.maxLength = 1000; ta.placeholder = "اكتب ردّك"; ta.value = m.reply || "";
    const sv = mk("button","sbtn","حفظ الرد"); sv.onclick = () => up({ reply: ta.value.trim() || null });
    d.append(ta, sv);
  };

  del.onclick = async()=>{ if(!confirm("هل تريد حذف هذه الرسالة؟")) return; await db.from("messages").delete().eq("id", m.id); loadMsgs(user); };

async function loadMsgs(user){
  const { data, error } = await db.from("messages").select("id,to_user,body,sender_name,is_public,reply,created_at,read_at,starred").eq("to_user", user.id).order("created_at",{ascending:false});
  const box = $("list"); if(!box) return; box.innerHTML = "";
  if(error) return box.textContent = "تعذّر تحميل الرسائل";
  $("cnt").textContent = data.length;
  window._st = Object.assign(window._st || {}, { msgs: data.length, pubs: data.filter(m => m.is_public).length, replies: data.filter(m => m.reply).length }); drawStats();
  const ids = data.filter(m => !m.read_at).map(m => m.id);
  data.forEach(m => m.fresh = !m.read_at);
  const fl = $("flist"), fb = $("fbox"); fl.innerHTML = "";
  const fav = data.filter(m => m.starred);
  fb.hidden = !fav.length;
  fav.forEach(m => fl.appendChild(msgCard(m, user)));
  if(!data.length) return void (box.innerHTML = `<div class="ok"><b>شارك رابطك لتصلك أول رسالة</b><small class="tag">انشره في واتساب أو ستوري إنستغرام، وسيصلك أصدقاؤك.</small></div>`);

  if(ids.length){ await db.from("messages").update({ read_at: new Date().toISOString() }).in("id", ids); db.from("notifications").update({ read:true }).eq("user_id", user.id).eq("kind","message").then(()=>setBadge(0), ()=>{}); }

async function renderPub(box, ownerId, s){
  const pm = await db.from("public_messages").select("id,body,reply,created_at").eq("to_user", ownerId).order("created_at",{ascending:false}).limit(20);
  if(!pm.data || !pm.data.length) return;
  const ids = pm.data.map(m => m.id), cnts = {}, mine = new Set();
  ((await db.rpc("thanks_counts", { uid: ownerId })).data || []).forEach(x => cnts[x.message_id] = Number(x.cnt));
  if(s) ((await db.from("message_thanks").select("message_id").eq("user_id", s.user.id).in("message_id", ids)).data || []).forEach(x => mine.add(x.message_id));
  const g = mk("div","glass sm"); g.appendChild(mk("h2", null, "رسائل منشورة"));
  pm.data.forEach(m => {
    const d = mk("div","msg"); d.appendChild(mk("p", null, m.body)); if(m.reply) d.appendChild(mk("p","rep","الرد: " + m.reply));
    const b = mk("button","th");
    const draw = () => { b.className = "th" + (mine.has(m.id) ? " on" : ""); b.innerHTML = ic("thumb") + " شكرًا " + (cnts[m.id] || 0).toLocaleString("en"); };
    draw();
    b.onclick = async()=>{
      if(!s){ toast("سجّل الدخول لتشكر صاحب الرسالة"); return; }
      const had = mine.has(m.id);
      const r = had ? await db.from("message_thanks").delete().eq("user_id", s.user.id).eq("message_id", m.id) : await db.from("message_thanks").insert({ message_id: m.id, user_id: s.user.id });
      if(r.error){ toast("تعذّر تنفيذ العملية"); return; }
      if(had){ mine.delete(m.id); cnts[m.id] = Math.max(0, (cnts[m.id] || 1) - 1); } else { mine.add(m.id); cnts[m.id] = (cnts[m.id] || 0) + 1; }
      draw();
    };
    d.appendChild(b); g.appendChild(d);
  });
  box.appendChild(g);
}

  const { data } = await db.from("banned_words").select("word").order("word");
  const box = $("ad"); box.innerHTML = "";
  const inp = mk("input"); inp.placeholder = "كلمة ممنوعة جديدة";
  const add = mk("button", null, "إضافة");
  add.onclick = async()=>{ const w = inp.value.trim().toLowerCase(); if(!w) return; await db.from("banned_words").insert({ word: w }); aWords(); };
  box.append(inp, add);
  (data || []).forEach(w => { const d = mk("div","stat"); d.appendChild(mk("span", null, w.word)); const x = mk("button","sbtn red","حذف"); x.onclick = async()=>{ await db.from("banned_words").delete().eq("word", w.word); aWords(); }; d.appendChild(x); box.appendChild(d); });
}
async function aAdm(){
  const { data } = await db.rpc("admin_list_admins");
  const box = $("ad"); box.innerHTML = "";
  box.appendChild(mk("p","tag","المشرف يملك كل صلاحيات لوحة الإدارة. أضف فقط من تثق به، وله حساب مسجّل في Supabase."));
  (data || []).forEach(a => { const d = mk("div","stat"); d.appendChild(mk("span", null, a.email)); const x = mk("button","sbtn red","إزالة"); x.onclick = async()=>{ if(!confirm("إزالة هذا المشرف؟")) return; const r = await db.rpc("admin_remove_admin", { uid: a.user_id }); if(r.error) alert("تعذّرت الإزالة (لا يمكن إزالة آخر مشرف)"); aAdm(); }; d.appendChild(x); box.appendChild(d); });
  const inp = mk("input"); inp.type = "email"; inp.dir = "ltr"; inp.placeholder = "بريد المشرف الجديد";
  const add = mk("button", null, "إضافة مشرف"), nt = mk("div","note");
  add.onclick = async()=>{ if(!inp.value.trim()) return; const r = await db.rpc("admin_add_admin", { mail: inp.value.trim() }); if(r.error){ nt.textContent = (r.error.message || "").includes("NOUSER") ? "لا يوجد حساب بهذا البريد" : "تعذّرت الإضافة"; return; } aAdm(); };
  box.append(inp, add, nt);
}
async function aTools(){
  const box = $("ad"); box.innerHTML = "";
  const nt = mk("div","note");
  const b1 = mk("button","ghost","حذف الزيارات الأقدم من 30 يومًا");
  b1.onclick = async()=>{ const r = await db.rpc("admin_cleanup_visits", { days: 30 }); nt.textContent = r.error ? "تعذّر التنظيف" : "تم التنظيف"; nt.classList.toggle("good", !r.error); };
  const b2 = mk("button","ghost","تصدير الحسابات (CSV)");
  b2.onclick = async()=>{ const a = await accounts(); csv([["الاسم","الرابط","الجنس","موقوف","تاريخ التسجيل"], ...a.map(x => [x.username, x.slug, x.gender, x.banned ? "نعم" : "لا", x.created_at])], "accounts.csv"); };
  const b3 = mk("button","ghost","تصدير آخر 100 رسالة (CSV)");
  b3.onclick = async()=>{ const names = await nameMap(); const m = (await db.rpc("admin_messages")).data || []; csv([["إلى","المرسل","الرسالة","التاريخ"], ...m.map(x => [names[x.to_user] || "", x.sender_id ? (names[x.sender_id] || "") : "زائر", x.body, x.created_at])], "messages.csv"); };
  box.append(b1, b2, b3, nt);
}
start();
</script>
