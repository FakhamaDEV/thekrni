<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>ذكّرني</title>
<meta name="description" content="أنشئ رابطك الخاص واستقبل رسائل مجهولة">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌙%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://js.hcaptcha.com/1/api.js?render=explicit" async defer></script>
<style>
:root{--bg:#04201a;--bg2:#0a3a2c;--gold:#e3b94a;--gold2:#b88a1e;--txt:#f4efe0;--mut:#9fb8ac;--glass:rgba(255,255,255,.06);--line:rgba(227,185,74,.28);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;font-family:Tajawal,Tahoma,sans-serif;color:var(--txt);min-height:100vh;min-height:100dvh;
background:radial-gradient(circle at 80% -10%,#1b8a6455,transparent 45%),linear-gradient(160deg,var(--bg),var(--bg2))}
.wrap{width:100%;max-width:760px;margin:0 auto;padding:14px 16px 30px}
.sm{max-width:480px;margin-inline:auto}
.tb{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 2px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.tbrand{font-family:Amiri,serif;font-size:28px;color:var(--gold);cursor:pointer}
.tbr{display:flex;gap:6px;align-items:center}
.ic{width:auto;min-width:58px;margin:0;padding:6px 8px;background:#ffffff0d;border:1px solid var(--line);box-shadow:none;color:var(--txt);font-size:20px;border-radius:14px;position:relative;line-height:1.2}
.ic small{display:block;font-size:11px;font-weight:400;color:var(--mut)}
.bd{position:absolute;top:-6px;left:-4px;background:#e0533d;color:#fff;border-radius:12px;font-size:11px;font-style:normal;padding:1px 6px;font-weight:700}
.hero{text-align:center;padding:30px 8px 20px}
.moon{font-size:50px}
h1.brand{font-family:Amiri,serif;font-size:clamp(50px,14vw,72px);margin:4px 0 0;line-height:1.2;background:linear-gradient(180deg,#fff3c4,var(--gold) 55%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:clamp(17px,4.6vw,20px);line-height:2;margin:8px 0 2px}
.lead{font-family:Amiri,serif;font-size:clamp(24px,6.6vw,34px);line-height:1.9;margin:10px 0 6px;color:#fff3c4}
.lead em{font-style:normal;color:var(--gold)}
.tag{color:var(--mut);font-size:15px;line-height:1.9}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:14px}
.glass h2{margin:0 0 10px;font-size:19px;color:var(--gold)}
.steps{display:grid;gap:12px}
.step{display:flex;gap:14px;align-items:center}
.n{flex:none;width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#f3d77a,var(--gold2));color:#04201a;font-weight:700;font-size:19px;display:flex;align-items:center;justify-content:center}
.step b{display:block}.step small{color:var(--mut)}
.feats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.feats .glass{margin:0;text-align:center;padding:14px 8px}
.feats span{font-size:28px;display:block;margin-bottom:4px}
.feats small{color:var(--mut);line-height:1.7}
.zikr{text-align:center;color:var(--gold);font-family:Amiri,serif;font-size:24px;margin:16px 0 0}
.respect{text-align:center;border-color:var(--gold)}
.respect h2{font-family:Amiri,serif;font-size:clamp(22px,6vw,28px);margin-bottom:12px}
.respect p{line-height:2.1;margin:10px 0;font-size:16.5px}
.ann{border:2px solid var(--gold);background:#e3b94a1a;margin:12px 0 0;border-radius:18px;padding:14px 16px;text-align:center}
.ann b{display:block;color:var(--gold);font-size:19px;margin-bottom:4px}
.ann p{margin:0;line-height:1.9;white-space:pre-wrap}
.tips{margin:0;padding:0;list-style:none}
.tips li{padding:9px 0;border-bottom:1px dashed var(--line);line-height:1.9}
.tips li:last-child{border:0}
.tips b{color:var(--gold)}
input,textarea,select{width:100%;padding:13px;margin:6px 0;border:1px solid var(--line);border-radius:14px;font-size:16px;font-family:inherit;background:#00000033;color:var(--txt);outline:none}
select option{color:#000}
input[type=color]{padding:2px;height:44px}
input::placeholder,textarea::placeholder{color:#8aa397}
input:focus,textarea:focus{border-color:var(--gold)}
textarea{resize:vertical}
button{width:100%;padding:14px;margin:6px 0;border:0;border-radius:14px;font-size:17px;font-weight:700;font-family:inherit;cursor:pointer;color:#04201a;background:linear-gradient(135deg,#f6dc84,var(--gold) 50%,var(--gold2))}
button:active{transform:scale(.98)}
button.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold)}
button:disabled{opacity:.55}
button.sbtn{width:auto;padding:7px 16px;font-size:14px;margin:6px 0 0 8px}
button.red{background:#c0392b;color:#fff}
.avatar{width:92px;height:92px;margin:0 auto 10px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:700;color:#04201a;background:linear-gradient(135deg,#f6dc84,var(--gold2));box-shadow:0 0 0 5px #e3b94a33}
.who{font-family:Amiri,serif;font-size:clamp(30px,9vw,42px);margin:4px 0;color:var(--gold);word-break:break-word}
.ub{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 0 0;padding:12px 14px}
.ub .av2{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:19px;color:#04201a;background:linear-gradient(135deg,#f6dc84,var(--gold2))}
.ub b{flex:1;color:var(--gold);word-break:break-word;font-size:18px}
.lbl{color:var(--mut);margin-top:8px;font-size:15px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.chip{flex:1;text-align:center;padding:10px 14px;border-radius:30px;border:1px solid var(--line);background:#ffffff08;cursor:pointer;font-size:16px}
.chip.on{background:linear-gradient(135deg,#f6dc84,var(--gold2));color:#04201a;font-weight:700;border-color:transparent}
.cnt{text-align:left;color:var(--mut);font-size:13px;direction:ltr}
.note{text-align:center;color:#ff9b8f;min-height:22px;margin-top:6px}
.note.good{color:var(--gold)}
.warn{background:#e3b94a14;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.8;color:#f6e7b0;margin:6px 0}
.ok{text-align:center;padding:12px 4px}.ok .big{font-size:48px}.ok b{display:block;font-size:20px;color:var(--gold);margin:6px 0}
.link{direction:ltr;word-break:break-all;background:#00000040;padding:12px;border-radius:12px;font-size:14px;color:var(--gold);border:1px dashed var(--line)}
.msg{background:#ffffff0a;border-right:4px solid var(--gold);border-radius:14px;padding:13px;margin:10px 0}
.msg p{margin:8px 0;line-height:1.9;white-space:pre-wrap;word-break:break-word}
.msg small{color:var(--mut)}
.msg .from{display:block;color:var(--gold);margin-bottom:4px}
.msg .rep{border-right:3px solid var(--gold2);padding-right:10px;color:#f6e7b0}
.new{background:var(--gold);color:#04201a;border-radius:10px;padding:1px 10px;font-size:12px;font-weight:700;margin-left:6px}
.top{display:flex;justify-content:space-between;align-items:center}.top h2{margin:0}
.num{background:var(--gold);color:#04201a;border-radius:20px;padding:2px 14px;font-weight:700}
.chk{display:flex;gap:8px;align-items:center;margin:8px 0;color:var(--txt)}
.chk input{width:auto;margin:0}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.stat{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--gold);color:#04201a;padding:12px 22px;border-radius:30px;font-weight:700;z-index:50}
.hc{display:flex;justify-content:center;margin:8px 0;min-height:78px}
footer{text-align:center;color:var(--mut);font-size:14px;margin-top:28px;padding-top:14px;border-top:1px solid var(--line)}
footer b{color:var(--gold)}
@media(min-width:700px){.wrap{padding:24px 24px 40px}.feats{grid-template-columns:repeat(3,1fr)}.glass{padding:24px}}
</style>
<style id="custom"></style>
</head>
<body>
<div class="wrap"><div id="app"></div><footer id="ft"></footer></div>
<script>
// ====== بيانات المشروع ======
const SUPABASE_URL = "https://pkyqkzqkxfcytvtsygse.supabase.co";
const SUPABASE_KEY = "sb_publishable_ZIeFUW3JFOEHV7-wImxM1Q_g5JM4wHZ";
const HC_KEY = "94766dfe-902c-4f4a-ac04-6f36f8b0719e";
// =============================
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const app = document.getElementById("app");
const params = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);
const mk = (t, c, x) => { const e = document.createElement(t); if(c) e.className = c; if(x != null) e.textContent = x; return e; };
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const go = q => { location.href = location.pathname + q; };
let chan = null, reload = null, ANN = null, SET = {}, hcId = null;
const N = () => SET.site_name || "ذكّرني";
const T = (k, d) => SET[k] || d;
const on = k => SET[k] !== "0";
const MAXLEN = () => Math.min(1000, Number(SET.max_msg_len) || 1000);
const el = h => { reload = null; hcId = null; app.innerHTML = h; window.scrollTo(0,0); const b = $("home"); if(b) b.onclick = () => go(""); };
const say = (id, t, good) => { const n = $(id); if(n){ n.textContent = t; n.classList.toggle("good", !!good); } };
const HOME = `<button class="ghost sbtn" id="home" style="margin:10px 0 0">الصفحة الرئيسية</button>`;
const NAME_RE = /^[\u0621-\u064A\u0660-\u0669a-z0-9_]+(?: [\u0621-\u064A\u0660-\u0669a-z0-9_]+)*$/;
const NAME_MSG = "اسم المستخدم: من 3 إلى 25 حرفًا، عربيًا أو إنجليزيًا، ويمكن وضع مسافة بين الكلمات";
const SLUG_MSG = "الرابط: من 3 إلى 25 حرفًا إنجليزيًا أو رقمًا أو _";
const RESERVED = ["admin","login","signup","profile","notifications","support","help","about"];
const normName = s => s.trim().replace(/\s+/g, " ").toLowerCase();
const nameOk = s => s.length >= 3 && s.length <= 25 && NAME_RE.test(s);
const slugOk = s => /^[a-z0-9_]{3,25}$/.test(s) && !RESERVED.includes(s);
const linkOf = s => location.origin + location.pathname + "?u=" + s;
const ERR = [
  ["invalid login","البريد الإلكتروني أو كلمة المرور غير صحيحة"],
  ["captcha","فشل التحقق، أعد المحاولة"],
  ["already registered","هذا البريد الإلكتروني مسجّل مسبقًا"],
  ["at least","كلمة المرور قصيرة جدًا"],
  ["not confirmed","لم يتم تأكيد بريدك الإلكتروني بعد"],
  ["rate limit","محاولات كثيرة، حاول لاحقًا"],
  ["invalid","البريد الإلكتروني غير صالح"]
];
const arErr = e => { const m = ((e && e.message) || "").toLowerCase(); const f = ERR.find(x => m.includes(x[0])); return f ? f[1] : "حدث خطأ، حاول مرة أخرى"; };
const fmt = d => new Date(d).toLocaleString("ar");
const track = () => db.from("visits").insert({ device: innerWidth < 768 ? "جوال" : "حاسوب" }).then(()=>{}, ()=>{});
const getSession = async () => (await db.auth.getSession()).data.session;
const cnt = async (t, f, col) => { let q = db.from(t).select(col || "id", { count:"exact", head:true }); if(f) q = f(q); return (await q).count ?? 0; };
const darken = h => { const n = parseInt(h.slice(1), 16); const f = v => Math.max(0, Math.round(v * .78)); return "#" + [n >> 16, (n >> 8) & 255, n & 255].map(v => f(v).toString(16).padStart(2, "0")).join(""); };

async function loadSettings(){
  const r = await db.from("site_settings").select("key,value");
  SET = {}; (r.data || []).forEach(x => SET[x.key] = x.value);
  const root = document.documentElement.style;
  if(/^#[0-9a-f]{6}$/i.test(SET.accent || "")){ root.setProperty("--gold", SET.accent); root.setProperty("--gold2", darken(SET.accent)); }
  if(/^#[0-9a-f]{6}$/i.test(SET.bg || "")){ root.setProperty("--bg", SET.bg); root.setProperty("--bg2", SET.bg); }
  $("custom").textContent = SET.custom_css || "";
  document.title = N();
  $("ft").innerHTML = `© 2026 <b>${esc(N())}</b> &nbsp;|&nbsp; تطوير: <b>${esc(T("footer_dev","FakhamaDev"))}</b>`;
}
async function loadAnn(){
  const a = await db.from("announcements").select("title,body,show_all").eq("active", true).order("created_at", { ascending:false }).limit(1);
  ANN = (a.data && a.data[0]) || null;
}
const PCOLS = "username,slug,banned,username_changed_at,slug_changed_at";
async function ensureProfile(user){
  const p = await db.from("profiles").select(PCOLS).eq("id", user.id).maybeSingle();
  if(p.data) return p.data;
  const m = user.user_metadata || {};
  if(m.username && m.slug){
    const r = await db.from("profiles").insert({ id: user.id, username: m.username, slug: m.slug, gender: m.gender || null });
    if(!r.error) return { username: m.username, slug: m.slug, banned: false };
  }
  return null;
}
const annHtml = home => (!ANN || !(home || ANN.show_all)) ? "" : `<div class="ann">${ANN.title ? `<b>${esc(ANN.title)}</b>` : ""}<p>${esc(ANN.body)}</p></div>`;
function toast(t){ const d = mk("div","toast",t); document.body.appendChild(d); setTimeout(() => d.remove(), 4000); }
function setBadge(n){ window._nb = n; const b = $("bd"); if(!b) return; b.textContent = n.toLocaleString("ar-EG"); b.hidden = n <= 0; }
const BAR = () => `<div class="tb"><b class="tbrand" id="tbh">${esc(N())}</b><div class="tbr">
  <button class="ic" id="icn">🔔<small>الإشعارات</small><i class="bd" id="bd" hidden></i></button>
  <button class="ic" id="ica">👤<small>حسابي</small></button>
  <button class="ic" id="ico">🚪<small>خروج</small></button></div></div>`;
async function wireBar(user){
  $("tbh").onclick = () => go("");
  $("icn").onclick = () => notifPage(user);
  $("ica").onclick = () => go("?profile");
  $("ico").onclick = async()=>{ await db.auth.signOut(); go(""); };
  setBadge(await cnt("notifications", q => q.eq("read", false)));
  if(chan) db.removeChannel(chan);
  chan = db.channel("n" + user.id).on("postgres_changes", { event:"INSERT", schema:"public", table:"notifications", filter:"user_id=eq." + user.id },
    pl => { setBadge((window._nb || 0) + 1); toast(pl.new.body); if(reload && pl.new.kind === "message") reload(); }).subscribe();
}
function bannedPage(){
  el(`<div class="hero"><div class="moon">🌙</div><p class="sub">تم إيقاف هذا الحساب</p><p class="tag">إن كان ذلك بالخطأ فتواصل مع إدارة الموقع.</p></div><button class="ghost" id="out">تسجيل الخروج</button>`);
  $("out").onclick = async()=>{ await db.auth.signOut(); go(""); };
}
function maintPage(){
  el(`<div class="hero"><div class="moon">🛠️</div><h1 class="brand">${esc(N())}</h1><p class="sub">${esc(T("maintenance_text","الموقع في صيانة قصيرة، سنعود قريبًا."))}</p></div>`);
}
// ===== التحقق (hCaptcha) =====
function mountCaptcha(){
  const box = $("hc"); if(!box) return;
  let tries = 0;
  const t = setInterval(() => {
    if(window.hcaptcha){ clearInterval(t); hcId = hcaptcha.render(box, { sitekey: HC_KEY, theme: "dark" }); }
    else if(++tries > 40){ clearInterval(t); say("note","تعذّر تحميل مربع التحقق، جرّب شبكة أخرى."); }
  }, 250);
}
const hcToken = () => (window.hcaptcha && hcId !== null) ? hcaptcha.getResponse(hcId) : "";
const hcReset = () => { if(window.hcaptcha && hcId !== null) hcaptcha.reset(hcId); };

async function start(){
  const special = ["admin","profile","login","signup"].some(k => params.has(k)) || params.get("u");
  if(!special){ $("ft").innerHTML = "© 2026 <b>ذكّرني</b> &nbsp;|&nbsp; تطوير: <b>FakhamaDev</b>"; landing(null); }
  const [, , s] = await Promise.all([loadSettings(), loadAnn(), getSession()]);
  if(SET.maintenance === "1" && !params.has("admin")) return maintPage();
  if(params.has("admin")) return s ? adminPage() : authPage("login");
  if(params.has("profile")) return s ? editPage(s.user) : authPage("login");
  if(params.has("login") || params.has("signup")) return s ? dashboard(s.user) : authPage(params.has("signup") ? "signup" : "login");
  track();
  if(params.get("u")) return sendPage(params.get("u").trim().toLowerCase());
  landing(s);
}

const RESPECT = `<div class="glass respect"><h2>🌿 الاحترام أساس التعامل بين الناس 🌿</h2>
  <p>احترم غيرك بكلامك وأفعالك، فالكلمة الطيبة صدقة، والأسلوب الراقي دليل على حسن التربية. لا تجرح مشاعر الآخرين، ولا تقلّل من شأن أحد، واختلف مع الناس بأدب واحترام.</p>
  <p>تذكّر دائماً: عامل الناس كما تحب أن يعاملوك، فالاحترام لا يُفرض بالقوة، بل يُكتسب بالأخلاق، والكلمة الطيبة تترك أثراً جميلاً في القلوب. 🌱</p></div>`;

async function landing(s){
  const p = s ? await ensureProfile(s.user) : null;
  if(p && p.banned) return bannedPage();
  const top = p ? BAR() : `<div class="tb"><b class="tbrand" id="tbh">${esc(N())}</b><div class="tbr"><button class="ghost sbtn" id="nl" style="margin:0">دخول</button>${on("allow_signup") ? `<button class="sbtn" id="ns" style="margin:0">حساب جديد</button>` : ""}</div></div>`;
  const who = p ? `<div class="glass ub"><div class="av2">${esc(p.username[0])}</div><b>${esc(p.username)}</b><button class="sbtn" id="ub1" style="margin:0">صندوق رسائلي</button></div>` : "";
  const sg = s ? `<textarea id="sg" rows="3" maxlength="500" placeholder="اكتب اقتراحك هنا (500 حرف كحد أقصى)"></textarea><button id="sgb">إرسال الاقتراح</button><div class="note" id="sgn"></div>`
    : `<p class="tag">يمكن للأعضاء المسجّلين فقط إرسال الاقتراحات.</p><button class="ghost" id="sgl">تسجيل الدخول</button>`;
  el(`${top}${annHtml(true)}${who}
  <div class="hero"><div class="moon">🌙</div><h1 class="brand">${esc(N())}</h1>
    <p class="sub">مرحبًا بك في ${esc(N())}</p>
    <p class="lead">${esc(T("hero_lead","رسائلُ صادقة تصلك بلا أسماء"))}</p>
    <p class="tag">${esc(T("hero_tag","أنشئ حسابك واحصل على رابط خاص بك، وشاركه ليرسل لك الناس رسائل دون كشف هويتهم."))}</p></div>
  ${p ? "" : `<div class="sm">${on("allow_signup") ? `<button id="go">إنشاء حساب</button>` : ""}<button class="ghost" id="go2">تسجيل الدخول</button></div>`}
  <div class="glass"><h2>كيف يعمل الموقع؟</h2><div class="steps">
    <div class="step"><div class="n">١</div><div><b>أنشئ حسابك</b><small>سجّل باسمك وبريدك الإلكتروني</small></div></div>
    <div class="step"><div class="n">٢</div><div><b>شارك رابطك</b><small>انسخه وانشره في واتساب أو إنستغرام أو أي مكان</small></div></div>
    <div class="step"><div class="n">٣</div><div><b>استقبل الرسائل</b><small>تصلك الرسائل في صندوقك، ولا تعرف من أرسلها</small></div></div></div></div>
  <div class="feats">

    <button id="act">${su ? "إنشاء الحساب" : "دخول"}</button>
    <button class="ghost" id="sw">${su ? "لديّ حساب، تسجيل الدخول" : "ليس لديّ حساب، إنشاء حساب"}</button>
    <div class="note" id="note"></div></div>`);
  mountCaptcha();
  $("sw").onclick = () => go(su ? "?login" : "?signup");
  let gender = "";
  if(su) $("gen").onclick = e => { const c = e.target.closest(".chip"); if(!c) return; gender = c.dataset.g; [...$("gen").children].forEach(x => x.classList.toggle("on", x === c)); };
  $("act").onclick = async()=>{
    const email = $("email").value.trim(), pass = $("pass").value;
    say("note","");
    if(!email || !pass) return say("note","أدخل البريد الإلكتروني وكلمة المرور");
    const token = hcToken();
    if(!token) return say("note","أكمل مربع التحقق أولًا");
    if(!su){
      $("act").disabled = true;
      const { data, error } = await db.auth.signInWithPassword({ email, password: pass, options: { captchaToken: token } });
      $("act").disabled = false;
      if(error){ hcReset(); return say("note", arErr(error)); }
      return params.has("admin") ? adminPage() : params.has("profile") ? editPage(data.user) : dashboard(data.user);
    }
    const u = normName($("username").value), sl = $("slug").value.trim().toLowerCase();
    if(!gender) return say("note","اختر الجنس");
    if(!nameOk(u)) return say("note", NAME_MSG);
    if(!slugOk(sl)) return say("note", SLUG_MSG);
    if(pass.length < 8) return say("note","كلمة المرور يجب أن تكون 8 أحرف على الأقل");
    $("act").disabled = true;
    const t1 = await db.from("profiles").select("id").eq("username", u).maybeSingle();
    if(t1.data){ $("act").disabled = false; hcReset(); return say("note","اسم المستخدم محجوز، اختر اسمًا آخر"); }
    const t2 = await db.from("profiles").select("id").eq("slug", sl).maybeSingle();
    if(t2.data){ $("act").disabled = false; hcReset(); return say("note","هذا الرابط محجوز، اختر رابطًا آخر"); }
    const { data, error } = await db.auth.signUp({ email, password: pass, options:{ captchaToken: token, data:{ username: u, slug: sl, gender } } });
    if(error){ $("act").disabled = false; hcReset(); return say("note", arErr(error)); }

    dashboard(data.user);
  };
}

function msgCard(m, user){
  const d = mk("div","msg");
  if(m.fresh) d.appendChild(mk("span","new","جديدة"));
  if(m.sender_name) d.appendChild(mk("small","from","من: " + m.sender_name));
  d.appendChild(mk("p", null, m.body));
  if(m.reply) d.appendChild(mk("p","rep","ردّك: " + m.reply));
  d.appendChild(mk("small", null, fmt(m.created_at) + (m.is_public ? " • منشورة في صفحتك" : " • خاصة")));
  const row = mk("div");
  const up = async f => { await db.from("messages").update(f).eq("id", m.id); loadMsgs(user); };
  const st = mk("button","sbtn ghost", m.starred ? "إزالة التمييز ⭐" : "⭐ تمييز"); st.onclick = () => up({ starred: !m.starred });
  const pub = mk("button","sbtn ghost", m.is_public ? "إلغاء النشر" : "نشر في صفحتي"); pub.onclick = () => up({ is_public: !m.is_public });
  const rp = mk("button","sbtn ghost","رد");
  rp.onclick = ()=>{
    rp.disabled = true;
    const ta = mk("textarea"); ta.rows = 3; ta.maxLength = 1000; ta.placeholder = "اكتب ردّك"; ta.value = m.reply || "";
    const sv = mk("button","sbtn","حفظ الرد"); sv.onclick = () => up({ reply: ta.value.trim() || null });
    d.append(ta, sv);
  };
  const del = mk("button","sbtn red","حذف");
  del.onclick = async()=>{ if(!confirm("هل تريد حذف هذه الرسالة؟")) return; await db.from("messages").delete().eq("id", m.id); loadMsgs(user); };
  row.append(st, pub, rp, del); d.appendChild(row);
  return d;
}

async function loadMsgs(user){
  const { data, error } = await db.from("messages").select("id,to_user,body,sender_name,is_public,reply,created_at,read_at,starred").eq("to_user", user.id).order("created_at",{ascending:false});
  const box = $("list"); if(!box) return; box.innerHTML = "";
  if(error) return box.textContent = "تعذّر تحميل الرسائل";
  $("cnt").textContent = data.length;
  const ids = data.filter(m => !m.read_at).map(m => m.id);
  data.forEach(m => m.fresh = !m.read_at);
  const fl = $("flist"), fb = $("fbox"); fl.innerHTML = "";
  const fav = data.filter(m => m.starred);
  fb.hidden = !fav.length;
  fav.forEach(m => fl.appendChild(msgCard(m, user)));
  if(!data.length) return box.textContent = "لم تصلك رسائل بعد. شارك رابطك لتبدأ.";
  data.forEach(m => box.appendChild(msgCard(m, user)));
  if(ids.length){ await db.from("messages").update({ read_at: new Date().toISOString() }).in("id", ids); db.from("notifications").update({ read:true }).eq("user_id", user.id).eq("kind","message").then(()=>setBadge(0), ()=>{}); }
}

async function loadSent(){
  const box = $("sent"); if(!box) return;
  const { data, error } = await db.rpc("my_sent");
  box.innerHTML = "";
  if(error) return box.textContent = "تعذّر التحميل";
  if(!data.length) return box.textContent = "لم ترسل رسائل بعد.";
  data.forEach(m => {
    const d = mk("div","msg");
    d.appendChild(mk("p", null, "إلى: " + m.to_username));
    d.appendChild(mk("small", null, (m.read_at ? "قرأها المستلم" : "لم يقرأها المستلم بعد") + " • " + fmt(m.created_at)));
    if(m.read_at){ const h = mk("button","sbtn ghost","إزالة من القائمة"); h.onclick = async()=>{ await db.rpc("hide_sent", { mid: m.id }); loadSent(); }; d.appendChild(mk("div")).appendChild(h); }
    box.appendChild(d);
  });
}
